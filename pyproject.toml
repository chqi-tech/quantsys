[project]
name = "quantsys"
version = "0.1.0"
description = "Personal event-driven backtesting framework for US equities (learning + portfolio project)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

# Optional extras — installed only when you need them.
# - data:   real Alpaca data + parquet cache (the sample provider needs neither)
# - report: nothing extra; the HTML report is pure-Python SVG
# - dev:    tests
[project.optional-dependencies]
data = [
    "alpaca-py>=0.20",
    "pyarrow>=15",
    "pandas-market-calendars>=4.4",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
quantsys = "quantsys.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
