name: pages

# Publish the portfolio/ directory to GitHub Pages.
# The site lives in portfolio/ (not root or docs/), so we deploy via Actions
# rather than the "deploy from a branch" setting, which only supports those two.

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio
      - id: deployment
        uses: actions/deploy-pages@v4
