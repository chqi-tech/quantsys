name: paper-trade

# Forward paper-trading on Alpaca. Runs every weekday inside US market hours;
# the script's --monthly guard means it only actually trades on the first
# trading day of the month (or the very first run, when the account is empty).
# Use the manual "Run workflow" button for the initial build.

on:
  schedule:
    - cron: "5 14 * * 1-5"   # 14:05 UTC weekdays = 10:05 ET (EDT). ~30 min after the open, once opening
                             # volatility / wide spreads have settled → cleaner fills. :05 dodges GitHub's
                             # busy top-of-hour. NOTE: cron is fixed UTC — after DST ends (~Nov 2) change to
                             # "5 15 * * 1-5" to stay at 10:05 ET (otherwise it runs 9:05 ET, pre-open).
  workflow_dispatch: {}        # manual trigger (use this for the first build)

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync deps
        run: ~/.local/bin/uv sync --extra data

      - name: Rebalance (Alpaca paper)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: ~/.local/bin/uv run python live/rebalance.py --live --monthly --universe-mode sp500
